[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "socialflow"
version = "0.1.0"
description = "Cross-platform desktop application for managing and publishing content across multiple online platforms."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
    { name = "Damir Bubanovic" }
]
dependencies = [
    "Pillow>=11.0,<13",
    "PySide6>=6.8,<7",
    "keyring>=25.0,<26",
]
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.5",
]

[tool.setuptools.packages.find]
where = ["src"]